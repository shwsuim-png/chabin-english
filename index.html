<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>차빈이의 영어 척척박사 🐰✨</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:'Jua',sans-serif;margin:0;padding:24px 14px;background:linear-gradient(135deg,#FFE6F0,#E8F5E9);color:#444;min-height:100vh}
.container{max-width:680px;margin:auto;background:#fff;padding:24px 18px 30px;border-radius:28px;box-shadow:0 10px 25px rgba(0,0,0,.10);border:4px solid #FFB6C1}
.profile-card{width:150px;margin:0 auto 12px;padding:8px;background:#fff;border:3px solid #FFB6C1;border-radius:22px;box-shadow:0 5px 12px rgba(0,0,0,.10)}
.profile-card img{display:block;width:100%;height:130px;object-fit:contain;border-radius:15px;background:#FFF5F8}
.profile-fallback{height:130px;display:flex;align-items:center;justify-content:center;font-size:58px;background:#FFF5F8;border-radius:15px}
.badge{display:inline-block;background:#FF69B4;color:#fff;padding:4px 12px;border-radius:15px;margin:4px 0 5px}
h1{color:#FF1493;font-size:29px;margin:5px 0}
.main-message{font-size:18px;color:#555;margin:6px 0 20px;line-height:1.5}
.upload{border:3px dashed #FFB6C1;padding:22px 12px;border-radius:20px;background:#FFFDF0}
.upload input{font-family:inherit;font-size:16px;max-width:100%}
#loading{display:none;color:#FF1493;margin-top:12px;font-size:17px}
.notice{font-size:13px;color:#777;background:#fff;padding:9px;border-radius:10px;margin-top:10px;line-height:1.5}
.result{margin-top:18px;padding:18px;background:#F0FFF4;border:2px solid #81C784;border-radius:20px;text-align:left}
.sentence{padding:13px;background:#fff;border-radius:14px;margin:12px 0;line-height:2}
.word{display:inline-block;background:#FFE082;border:2px solid #FFB300;color:#424242;padding:5px 10px;margin:3px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:16px}
.word:hover{transform:translateY(-1px)}
.syllables{margin:8px 0 4px;padding:9px;background:#FFF8E1;border-radius:10px;font-size:15px}
.syl{display:inline-block;background:#E1F5FE;border:1px solid #29B6F6;padding:3px 7px;margin:2px;border-radius:8px;font-family:inherit;cursor:pointer}
.action{width:100%;border:0;padding:13px;font-size:17px;border-radius:14px;color:white;margin-top:10px;font-family:inherit;cursor:pointer}
.listen{background:#FF69B4}.listen:hover{background:#FF1493}
.quiz{margin-top:18px;padding:18px;background:#E0F7FA;border:2px solid #26C6DA;border-radius:20px;text-align:left}
.record{background:#00ACC1}.record.recording{background:#E53935;animation:pulse 1.1s infinite}
.stop{background:#546E7A}
.transcript{margin-top:12px;padding:12px;background:white;border-radius:12px;min-height:45px;line-height:1.5}
.feedback{margin-top:12px;padding:15px;background:white;border-radius:12px;border:1px solid #B2EBF2;line-height:1.65}
.hidden{display:none}
.error{color:#C62828}
.empty{padding:18px;text-align:center;background:#fff;border-radius:14px}
hr{border:0;border-top:1px solid #eee;margin:12px 0}
@keyframes pulse{50%{transform:scale(1.02)}}
</style>
</head>
<body>
<div class="container">
  <div class="profile-card">
    <img id="profileImg" src="차빈이.png" alt="차빈이" onerror="showProfileFallback()">
    <div id="profileFallback" class="profile-fallback hidden">🐰</div>
  </div>

  <div class="badge">✨ 차빈이 맞춤 영어 학습</div>
  <h1>영어 척척박사 🎓</h1>
  <div class="main-message">
    🐰 <b>차빈아, 알고 싶은 영어를 보여줘~!</b><br>
    사진으로 찍어서 올리면 내가 같이 읽어줄게.
  </div>

  <div class="upload">
    <input type="file" id="imageInput" accept="image/*">
    <div id="loading">🔎 영어 글자를 찾는 중이에요…</div>
    <div class="notice">
      영어가 크게 보이도록 사진을 찍어주면 더 잘 읽을 수 있어요.
      한글이나 그림이 함께 있어도 영어 부분만 골라볼게요!
    </div>
  </div>

  <div id="resultArea"></div>
</div>

<script>
const imageInput=document.getElementById('imageInput');
const loading=document.getElementById('loading');
const resultArea=document.getElementById('resultArea');

let sentences=[];
let currentSentenceIndex=0;
let recognition=null;
let isRecording=false;
let finalTranscript='';

function showProfileFallback(){
  document.getElementById('profileImg').style.display='none';
  document.getElementById('profileFallback').classList.remove('hidden');
}

imageInput.addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file)return;

  resultArea.innerHTML='';
  loading.style.display='block';

  try{
    const processed=await preprocessImage(file);
    const worker=await Tesseract.createWorker('eng');

    await worker.setParameters({
      tessedit_pageseg_mode:'6',
      preserve_interword_spaces:'1'
    });

    const ret=await worker.recognize(processed);
    await worker.terminate();

    const raw=ret.data.text||'';
    sentences=extractEnglishContent(raw);

    loading.style.display='none';
    renderResults();

  }catch(err){
    console.error(err);
    loading.style.display='none';
    resultArea.innerHTML=`
      <div class="result">
        <p class="error"><b>사진을 읽는 중 문제가 생겼어요.</b></p>
        <p>영어가 잘 보이도록 사진을 조금 더 가까이 찍어서 다시 올려 주세요.</p>
      </div>`;
  }
});

async function preprocessImage(file){
  const img=new Image();
  const url=URL.createObjectURL(file);
  img.src=url;

  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=reject;
  });

  const max=2200;
  const scale=Math.min(1.5,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');
  c.width=Math.round(img.width*scale);
  c.height=Math.round(img.height*scale);

  const ctx=c.getContext('2d');
  ctx.drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);

  return c;
}

/*
  OCR 결과에서 영어를 너무 엄격하게 걸러내지 않는다.
  특히 "cat", "apple", "I am..." 같은 짧은 단어/문장도 살린다.
*/
function normalizeOCRLine(line){
  let s=line
    .replace(/[|_~`^*+=<>[\]{}\\/]/g,' ')
    .replace(/[^\x00-\x7F]/g,' ')
    .replace(/\s+/g,' ')
    .trim();

  // 영어 글자가 하나도 없으면 제외
  if(!/[A-Za-z]/.test(s)) return '';

  // OCR 잡음이 너무 심한 경우 제외
  const letters=(s.match(/[A-Za-z]/g)||[]).length;
  const strange=(s.match(/[^A-Za-z0-9 .,!?;:'"()\-]/g)||[]).length;
  if(letters===0 || (letters<2 && strange>2)) return '';

  return s;
}

function extractEnglishContent(raw){
  const rawLines=raw.split(/\r?\n/);
  const cleaned=rawLines.map(normalizeOCRLine).filter(Boolean);

  /*
    OCR이 문장을 여러 줄로 나누더라도 영어 내용은 연결.
    문장 부호를 기준으로 문장 분리.
  */
  const joined=cleaned.join(' ');
  const chunks=joined.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[];

  const output=[];

  chunks.forEach(chunk=>{
    let s=chunk.replace(/\s+/g,' ').trim();

    // 앞뒤 OCR 찌꺼기 제거
    s=s.replace(/^[^A-Za-z]+/,'').replace(/[^A-Za-z0-9.!?'"(),;:\- ]+$/,'').trim();

    const words=s.match(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)||[];

    // 영어 단어 하나도 없으면 버림
    if(words.length===0)return;

    // 영어 단어가 있는 모든 짧은 콘텐츠도 살림
    // 단, 한 글자 OCR 잡음은 제외
    if(words.length===1 && words[0].length===1 && !/^(I|a)$/i.test(words[0]))return;

    output.push(s);
  });

  return [...new Set(output)];
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderResults(){
  if(!sentences.length){
    resultArea.innerHTML=`
      <div class="result empty">
        <div style="font-size:28px">🤔</div>
        <p><b>영어를 아직 잘 못 찾았어요.</b></p>
        <p style="font-size:14px">
          영어가 크게 보이게 다시 찍어보거나,<br>
          영어 부분만 잘라서 올려보세요.
        </p>
      </div>`;
    return;
  }

  resultArea.innerHTML=`
    <div class="result">
      <b>📖 찾은 영어</b>
      <p style="font-size:14px;margin-bottom:10px">
        단어를 누르면 <b>바로 단어 발음</b>을 들을 수 있어요.
      </p>
      <div id="sentences"></div>
    </div>`;

  const box=document.getElementById('sentences');

  sentences.forEach((sentence,i)=>{
    const div=document.createElement('div');
    div.className='sentence';

    div.innerHTML=`
      <b>문장 ${i+1}</b>
      <div id="words-${i}" style="margin-top:7px"></div>
      <button class="action listen" id="sentenceBtn-${i}">
        🔊 문장 전체 듣기
      </button>
      <button class="action" style="background:#7E57C2" id="meaningBtn-${i}">
        🎯 이 문장의 뜻 말해보기
      </button>`;

    box.appendChild(div);

    div.querySelector(`#sentenceBtn-${i}`).onclick=()=>speakText(sentence);
    div.querySelector(`#meaningBtn-${i}`).onclick=()=>startMeaningQuiz(i);

    const wbox=div.querySelector(`#words-${i}`);
    const words=sentence.match(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)||[];

    words.forEach(word=>{
      const b=document.createElement('button');
      b.className='word';
      b.textContent=word;

      /*
        핵심 UX 변경:
        단어를 누르는 순간 단어 전체 발음.
        음절은 "참고용 표시"로 바로 보여주고,
        개별 음절은 원할 때만 누른다.
      */
      b.onclick=()=>{
        speakText(word);
        showSyllables(b,word);
      };

      wbox.appendChild(b);
    });
  });
}

function showSyllables(button,word){
  document.querySelectorAll('.syllables').forEach(x=>x.remove());

  const box=document.createElement('div');
  box.className='syllables';

  const parts=roughSyllables(word);

  box.innerHTML='<b>🔤 음절</b> ';

  parts.forEach(part=>{
    const b=document.createElement('button');
    b.className='syl';
    b.textContent=part;

    // 음절은 눌렀을 때만 개별 발음
    b.onclick=()=>speakText(part);

    box.appendChild(b);
  });

  button.parentElement.appendChild(box);
}

function roughSyllables(word){
  const lower=word.toLowerCase();

  // 자주 쓰는 단어의 음절은 정확하게 지정
  const known={
    apple:['ap','ple'],
    banana:['ba','na','na'],
    computer:['com','pu','ter'],
    beautiful:['beau','ti','ful'],
    animal:['an','i','mal'],
    family:['fam','i','ly'],
    together:['to','geth','er'],
    school:['school'],
    teacher:['teach','er'],
    homework:['home','work'],
    English:['Eng','lish'],
    morning:['morn','ing'],
    evening:['eve','ning']
  };

  if(known[word]||known[lower]) return known[word]||known[lower];

  if(word.length<=3)return [word];

  // 학습용 근사 분리
  const matches=lower.match(
    /[bcdfghjklmnpqrstvwxyz]*[aeiouy]+(?:[bcdfghjklmnpqrstvwxyz]+(?=[aeiouy]|$)|$)/gi
  );

  if(!matches||matches.length<=1)return [word];

  let pos=0;
  const result=[];

  matches.forEach(part=>{
    const original=word.slice(pos,pos+part.length);
    if(original)result.push(original);
    pos+=part.length;
  });

  return result.length?result:[word];
}

function speakText(text){
  if(!('speechSynthesis' in window)){
    alert('이 브라우저는 음성 재생을 지원하지 않아요.');
    return;
  }

  speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='en-US';
  utterance.rate=.85;
  utterance.pitch=1.0;

  speechSynthesis.speak(utterance);
}

function startMeaningQuiz(index){
  currentSentenceIndex=index;
  finalTranscript='';

  const old=document.getElementById('quizBox');
  if(old)old.remove();

  const q=document.createElement('div');
  q.id='quizBox';
  q.className='quiz';

  q.innerHTML=`
    <b>🎯 뜻 맞추기</b>
    <p>이 문장은 무슨 뜻일까요?<br>
    <b>차빈이 생각대로 편하게 말해보세요.</b></p>

    <div style="background:white;padding:12px;border-radius:10px">
      <b>${escapeHTML(sentences[index])}</b>
    </div>

    <button id="recordBtn" class="action record">
      🎤 녹음 시작
    </button>

    <button id="stopBtn" class="action stop hidden">
      ⏹ 녹음 끝내기
    </button>

    <div id="transcript" class="transcript">
      아직 녹음하지 않았어요.
    </div>

    <button id="evaluateBtn" class="action" style="background:#00897B">
      🤖 AI에게 평가받기
    </button>

    <div id="feedback" class="feedback hidden"></div>`;

  resultArea.appendChild(q);

  document.getElementById('recordBtn').onclick=toggleRecord;
  document.getElementById('stopBtn').onclick=stopRecording;
  document.getElementById('evaluateBtn').onclick=evaluateMeaning;

  q.scrollIntoView({behavior:'smooth',block:'center'});
}

function toggleRecord(){
  if(isRecording){
    stopRecording();
    return;
  }

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SR){
    document.getElementById('transcript').innerHTML=
      '<span class="error">이 브라우저에서는 음성 인식을 지원하지 않아요. Chrome 또는 Edge에서 사용해 주세요.</span>';
    return;
  }

  recognition=new SR();
  recognition.lang='ko-KR';
  recognition.continuous=true;
  recognition.interimResults=true;

  finalTranscript='';
  isRecording=true;

  const recordBtn=document.getElementById('recordBtn');
  const stopBtn=document.getElementById('stopBtn');

  recordBtn.textContent='🔴 녹음 중… (말을 다 하면 아래 버튼을 눌러주세요)';
  recordBtn.classList.add('recording');
  stopBtn.classList.remove('hidden');

  recognition.onresult=e=>{
    let interim='';

    for(let i=e.resultIndex;i<e.results.length;i++){
      const text=e.results[i][0].transcript;

      if(e.results[i].isFinal){
        finalTranscript+=text+' ';
      }else{
        interim+=text;
      }
    }

    document.getElementById('transcript').textContent=
      (finalTranscript+interim).trim()||'듣고 있어요…';
  };

  recognition.onerror=e=>{
    console.error(e);

    if(e.error==='not-allowed'){
      document.getElementById('transcript').innerHTML=
        '<span class="error">마이크 사용 권한을 허용해 주세요.</span>';
    }else if(e.error!=='no-speech'){
      document.getElementById('transcript').innerHTML=
        '<span class="error">음성을 인식하지 못했어요. 다시 시도해 주세요.</span>';
    }
  };

  recognition.onend=()=>{
    // 사용자가 종료한 경우는 재시작하지 않음
    if(isRecording){
      try{recognition.start()}catch(_){}
    }
  };

  try{
    recognition.start();
  }catch(err){
    console.error(err);
  }
}

function stopRecording(){
  isRecording=false;

  if(recognition){
    try{recognition.stop()}catch(_){}
  }

  const recordBtn=document.getElementById('recordBtn');
  const stopBtn=document.getElementById('stopBtn');

  if(recordBtn){
    recordBtn.textContent='🎤 다시 녹음하기';
    recordBtn.classList.remove('recording');
  }

  if(stopBtn)stopBtn.classList.add('hidden');
}

async function evaluateMeaning(){
  const feedback=document.getElementById('feedback');
  const transcript=document.getElementById('transcript');

  const answer=(transcript.textContent||'').trim();
  const sentence=sentences[currentSentenceIndex];

  if(
    !answer ||
    answer==='아직 녹음하지 않았어요.' ||
    answer==='듣고 있어요…'
  ){
    feedback.classList.remove('hidden');
    feedback.innerHTML='🗣️ 먼저 녹음 버튼을 누르고 문장의 뜻을 말해 주세요.';
    return;
  }

  feedback.classList.remove('hidden');
  feedback.innerHTML='🤖 차빈이의 설명과 영어 문장의 뜻을 비교하고 있어요…';

  try{
    const res=await fetch('/api/evaluate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        sentence:sentence,
        userAnswer:answer
      })
    });

    if(!res.ok)throw new Error('API unavailable');

    const data=await res.json();
    renderFeedback(data,answer);

  }catch(err){
    /*
      AI 서버가 연결되지 않은 상태에서
      임의로 "참 잘했어요"라고 평가하지 않는다.
    */
    feedback.innerHTML=`
      <p><b>🗣️ 차빈이가 말한 뜻</b></p>
      <div style="background:#F7F7F7;padding:10px;border-radius:8px">
        ${escapeHTML(answer)}
      </div>

      <hr>

      <p><b>⚠️ AI 평가 기능을 연결해야 해요.</b></p>
      <p style="font-size:14px">
        현재 이 HTML 파일은 사진 읽기와 녹음/음성인식까지 작동합니다.
        하지만 <b>문장의 정확한 뜻과 차빈이의 답변을 비교하는 AI 평가</b>는
        별도의 서버 API 연결이 필요합니다.
      </p>

      <div class="notice">
        AI 연결 후에는<br>
        <b>① 정확한 뜻 → ② 차빈이가 이해한 부분 → ③ 잘못 이해한 부분
        → ④ 쉬운 설명 → ⑤ 다시 말해보기</b><br>
        순서로 평가하도록 만들 수 있습니다.
      </div>`;
  }
}

function renderFeedback(data,answer){
  const feedback=document.getElementById('feedback');

  feedback.innerHTML=`
    <b>${escapeHTML(data.result||'평가 결과')}</b>

    <p>🗣️ <b>차빈이가 말한 뜻</b><br>
    ${escapeHTML(answer)}</p>

    <p>📖 <b>정확한 뜻</b><br>
    ${escapeHTML(data.correctMeaning||'')}</p>

    <p>💡 <b>선생님 설명</b><br>
    ${escapeHTML(data.explanation||'')}</p>

    ${data.missingPoints?
      `<p>🔎 <b>조금 더 알아볼 부분</b><br>
      ${escapeHTML(data.missingPoints)}</p>`:''}`;
}
</script>
</body>
</html>
